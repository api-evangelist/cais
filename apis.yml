apis:
- aid: cais:cais-mcp-server
  name: CAIS MCP Server
  description: >-
    CAIS operates a remote Model Context Protocol server at https://mcp.caisgroup.com/mcp,
    announced 2026-05-19 as the first surface of the company's "Alts Engine" strategy and
    initially available to a select group of advisors within the CAIS network. It lets an
    agent query fund data, evaluate manager performance and surface portfolio insights from
    inside an advisor's existing workspace. The endpoint is protected by OAuth 2.1 with
    RFC 9728 protected-resource metadata, dynamic client registration (RFC 7591) and PKCE
    S256; twelve scopes are advertised across four service domains (caisiq, funds, iam, ips).
    tools/list is auth-gated — an anonymous JSON-RPC call returns HTTP 401 invalid_token —
    so the live tool schemas require an authenticated CAIS advisor client.
  humanURL: https://www.caisgroup.com/our-company/press/cais-integrates-with-anthropics-claude-to-give-advisors-instant-access-to-alternative-investment-intelligence
  baseURL: https://mcp.caisgroup.com/mcp
  tags:
  - MCP
  - Alternative Investments
  - Artificial Intelligence
